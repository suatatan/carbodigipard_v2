[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Redirect root to default locale (TR)
[[redirects]]
  from = "/"
  to = "/tr"
  status = 301

# 404 fallback
[[redirects]]
  from = "/*"
  to = "/tr"
  status = 404

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://mc.yandex.ru https://mc.yandex.com https://*.yandex.ru https://*.yandex.com https://yastatic.net https://*.yastatic.net; script-src-elem 'self' 'unsafe-inline' https://mc.yandex.ru https://mc.yandex.com https://*.yandex.ru https://*.yandex.com https://yastatic.net https://*.yastatic.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; frame-src https://www.youtube.com https://player.vimeo.com; connect-src 'self' https://mc.yandex.ru https://mc.yandex.com https://*.yandex.ru https://*.yandex.com wss://mc.yandex.ru wss://mc.yandex.com;"

# Cache static assets
[[headers]]
  for = "/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
